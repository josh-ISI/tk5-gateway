<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TK5 Tools &mdash; Sign in</title>
<style>
 :root{--bg:#0f1720;--panel:#16212e;--edge:#2b3f52;--ink:#e8eef4;--dim:#8da0b4;
   --dim2:#7c93a8;--accent:#37b6ff;--accent2:#1e88c7;--err:#ff6b6b;
   --mono:"Cascadia Code",Consolas,monospace}
 *{box-sizing:border-box}
 body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
   background:radial-gradient(circle at 50% 28%,#122132,#0d131b);
   font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}
 .card{width:340px;max-width:92vw;background:var(--panel);border:1px solid var(--edge);
   border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden}
 .card h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.3px;padding:20px 22px 2px}
 .card .sub{color:var(--dim);font-size:12.5px;padding:0 22px 16px}
 form{padding:0 22px 20px}
 .field{margin-bottom:12px}
 .field label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
 .field input{width:100%;background:var(--bg);border:1px solid var(--edge);color:var(--ink);
   padding:9px 11px;border-radius:7px;font-size:14px;font-family:var(--mono)}
 #user{text-transform:uppercase}
 .field input:focus{outline:none;border-color:var(--accent)}
 button{width:100%;margin-top:4px;background:var(--accent2);border:1px solid var(--accent);
   color:#fff;padding:10px;border-radius:7px;font-size:14px;cursor:pointer}
 button:hover{background:var(--accent)}
 .err{background:#33191c;border:1px solid #6a2b30;color:var(--err);font-size:12.5px;
   padding:8px 11px;border-radius:7px;margin-bottom:14px}
 .foot{text-align:center;color:var(--dim2);font-size:11px;padding:0 22px 16px}
</style>
</head>
<body>
 <div class="card">
  <h1>TK5 Tools</h1>
  <div class="sub">Sign in with your MVS user ID</div>
  <form method="POST" action="/auth/login" autocomplete="off">
   <!--MSG-->
   <div class="field">
    <label for="user">User ID</label>
    <input id="user" name="user" maxlength="8" autofocus required spellcheck="false">
   </div>
   <div class="field">
    <label for="pass">Password</label>
    <input id="pass" name="pass" type="password" maxlength="8" required>
   </div>
   <button type="submit">Sign in</button>
  </form>
  <div class="foot">MVS 3.8j &middot; TK5</div>
 </div>
</body>
</html>
